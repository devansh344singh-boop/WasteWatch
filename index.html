let detectorPromise=null;
async function getImageDetector(){
  if(!detectorPromise){
    detectorPromise=import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2')
      .then(async ({pipeline,RawImage})=>({
        detector:await pipeline('image-classification','onnx-community/ai-image-detection-ONNX',{device:'wasm'}),
        RawImage
      }));
  }
  return detectorPromise;
}
async function analyze(){
  const dup=S.reports.find(r=>{if(['resolved','rejected'].includes(r.status)||r.cat!=W.cat)return false;if(W.lat!=null&&W.lng!=null&&r.lat!=null&&r.lng!=null){const rad=x=>x*Math.PI/180,dLat=rad(r.lat-W.lat),dLng=rad(r.lng-W.lng),a=Math.sin(dLat/2)**2+Math.cos(rad(W.lat))*Math.cos(rad(r.lat))*Math.sin(dLng/2)**2;return 6371000*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))<250}return Number.isFinite(W.x)&&Number.isFinite(W.y)&&Math.hypot(r.x-W.x,r.y-W.y)<5});
  const q=W.w*W.h>=120000;
  W.ai={dup,q,rec:'amber',aiStatus:'loading',aiLabel:'Analyzing',aiGeneratedScore:null};
  W.run=true;render();
  try{
    const {detector,RawImage}=await getImageDetector();
    const image=await RawImage.fromURL(W.img);
    const predictions=await detector(image);
    const fake=predictions.find(p=>/fake|ai|synthetic|generated/i.test(p.label));
    const real=predictions.find(p=>/real|authentic|photograph|human/i.test(p.label));
    if(!fake&&!real) throw new Error('The model returned labels that could not be interpreted.');
    const aiGeneratedScore=fake?fake.score:Math.max(0,1-(real?.score||0));
    let aiLabel;
    if(aiGeneratedScore>=0.65) aiLabel='AI-generated likely';
    else if(aiGeneratedScore<=0.35) aiLabel='Real photo likely';
    else aiLabel='Uncertain result';
    W.ai.aiStatus='complete';W.ai.aiGeneratedScore=aiGeneratedScore;W.ai.aiLabel=aiLabel;
    W.ai.rec=(dup||!q||aiGeneratedScore>0.35)?'amber':'green';
  }catch(err){
    console.error('AI image check failed:',err);
    W.ai.aiStatus='unavailable';W.ai.aiLabel='Unavailable';W.ai.aiGeneratedScore=null;W.ai.rec='amber';
  }
  W.run=false;if(W&&W.step===3)render();
}

function ops(){const R=S.reports,c=s=>R.filter(r=>s.includes(r.status)).length,od=R.filter(r=>['submitted','review','verified'].includes(r.status)&&Date.now()-r.t>48*36e5).length,q=R.filter(r=>V.filter=='all'||['submitted','review','verified','await'].includes(r.status));
return`<h2>City operations</h2><small>Sample data · refreshed ${new Date().toLocaleTimeString()}</small><div class="g4">${stat('New reports',c(['submitted']))}${stat('Awaiting verification',c(['submitted','review']))}${stat('Verified, unassigned',c(['verified']))}${stat('Active cleanups',c(['assigned','accepted','way','arrived','cleaning']))}${stat('Awaiting resolution review',c(['await']))}${stat('Overdue (>48 h)',od)}</div><div class="g2"><div class="card"><div class="chips" style="margin-bottom:8px"><button class="chip ${V.filter!='all'?'on':''}" data-act="flt" data-v="act">Needs action</button><button class="chip ${V.filter=='all'?'on':''}" data-act="flt" data-v="all">All reports</button></div>${q.map(r=>`<button class="row" data-act="sel" data-id="${r.id}" style="${r.id==V.sel?'background:#10b98122':''}"><img src="${img(r)}" alt=""><div><b>${r.id}</b> · ${r.cat} <span style="color:${SC[r.sev]}">● ${r.sev}</span><small>${r.addr} · ${ago(r.t)}</small></div>${bd(r.status)}</button>`).join('')||'<p class="mut">Queue is clear.</p>'}</div><div><div class="card">${map(R,{ngos:1})}<p style="margin-top:6px">${legend}</p></div><div class="card" style="margin-top:14px"><h3>WasteWatch Intelligence <span class="tag">Rules-based</span></h3><div class="chips">${[['a','Verified with no NGO'],['b','High priority to review'],['c','Best NGO for selected'],['d','Awaiting resolution review']].map(x=>`<button class="chip" data-act="ask" data-v="${x[0]}">${x[1]}</button>`).join('')}</div><p style="margin-top:10px;font-size:14px">${V.ans||'<span class="mut">Ask a question. Answers are computed from the live data on this page.</span>'}</p></div></div></div>`}
function ask(k){const R=S.reports,L=a=>a.length?a.map(r=>r.id).join(', '):'none';if(k=='a')return'Verified and unassigned: '+L(R.filter(r=>r.status=='verified'));if(k=='b')return'High or critical reports awaiting review: '+L(R.filter(r=>['submitted','review'].includes(r.status)&&['High','Critical'].includes(r.sev)));if(k=='d')return'Awaiting resolution review: '+L(R.filter(r=>r.status=='await'));const r=sel();if(!r)return'Select a report first.';const t=rank(r).el[0];return t?`${r.id}: best eligible match is ${t.n.name} (${t.sc}/100, ${t.d.toFixed(1)} km, ${t.free} free team(s)).`:`${r.id}: no eligible NGO — escalate or request manual review.`}
const FL=['assigned','accepted','way','arrived','cleaning','await','resolved'],FN=['Assigned','Accepted','On the way','Arrived','Cleaning','Proof sent','Completed'],NX={assigned:['Accept task','accepted'],accepted:['Start — on the way','way'],way:['I’ve arrived','arrived'],arrived:['Start cleaning','cleaning']};
function tsk(){const L=S.reports.filter(r=>r.ngo&&['assigned','accepted','way','arrived','cleaning','await'].includes(r.status));return`<h2>My tasks</h2><small>${L.length} active · nearest first</small>${L.sort((a,b)=>Math.hypot(a.x-50,a.y-35)-Math.hypot(b.x-50,b.y-35)).map((r,i)=>{const k=FL.indexOf(r.status),nx=NX[r.status];return`<div class="card" style="margin-top:12px"><div style="display:flex;gap:12px"><img src="${img(r)}" alt="" style="width:84px;height:62px;border-radius:10px;object-fit:cover"><div><b>${r.id} · ${r.cat}</b> ${i==0?'<span class="bd ok">Nearest</span>':''}<br><small>${r.addr} · <span style="color:${SC[r.sev]}">${r.sev} priority</span> · ${r.ngo}</small><br><small>Equipment: ${r.cat=='Hazardous'?'hazmat kit, PPE':'gloves, bags, grabber'}</small></div></div><div style="display:flex;gap:3px;margin:12px 0">${FN.map((n,j)=>`<div style="flex:1"><div class="bar" style="height:6px"><i style="width:${j<=k?100:0}%"></i></div><small style="font-size:9px">${n}</small></div>`).join('')}</div><button class="btn s" data-act="nav">Open navigation</button> <button class="btn s" data-act="sel" data-id="${r.id}">Details</button>${nx?`<br><br><button class="btn p l" data-act="step" data-id="${r.id}">${nx[0]}</button>`:''}${r.status=='cleaning'?`<br><br><label for="a${i}" style="margin-top:0">After-cleanup photo (optional in demo)</label><input id="a${i}" type="file" accept="image/*" capture="environment" data-file="after" data-id="${r.id}">${V.pf[r.id]?'<small>Photo ready</small>':''}<br><br><button class="btn p l" data-act="proof" data-id="${r.id}">Submit proof</button>`:''}${r.status=='await'?'<p class="note am" style="margin-top:10px">Proof saved to the demo server. Awaiting reviewer decision.</p>':''}</div>`}).join('')||'<div class="card" style="margin-top:12px"><p class="mut">No tasks assigned. Ask a supervisor to dispatch one.</p></div>'}`}
function adm(){const R=S.reports,n=R.length,cnt=c=>R.filter(r=>r.cat==c).length,res=R.filter(r=>r.status=='resolved').length;return`<h2>Platform analytics</h2><small>All reports to date · counts are live from this demo store</small><div class="g4">${stat('Total reports',n)}${stat('Verified or beyond',R.filter(r=>!['submitted','review','rejected'].includes(r.status)).length)}${stat('Active assignments',R.filter(r=>['assigned','accepted','way','arrived','cleaning'].includes(r.status)).length)}${stat('Resolved',res)}${stat('Pending reviews',R.filter(r=>['submitted','review','await'].includes(r.status)).length)}${stat('NGOs with active load',S.ngos.filter(g=>g.load).length+'/'+S.ngos.length)}${stat('Avg. assignment → resolution','31 h','Demo value')}</div><div class="g2"><div class="card"><h3>Reports by category</h3>${CATS.map(c=>`<p style="font-size:13px">${c} <b style="float:right">${cnt(c)}</b></p><div class="bar"><i style="width:${n?cnt(c)/n*100:0}%"></i></div>`).join('<br>')}</div><div class="card"><h3>Reports, last 7 days <span class="tag">Demo data</span></h3><svg viewBox="0 0 200 90" width="100%"><polyline fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" points="5,70 38,55 71,60 104,35 137,42 170,20 195,26"/></svg><small>Definitions: response time = assignment → acceptance; cleanup time = acceptance → proof; resolution time = submission → reviewed closure.</small></div></div>`}
function aud(){return`<h2>NGOs & audit</h2><div class="card" style="margin-top:12px"><h3>Partner NGOs <span class="tag">Sample organizations</span></h3>${S.ngos.map(g=>`<p style="font-size:14px"><b>${g.name}</b> <small>${g.caps.filter(c=>c!='hazmat').join(', ')}${g.caps.includes('hazmat')?' · hazmat':''}</small><span style="float:right">${g.load}/${g.teams} teams busy</span></p><div class="bar"><i style="width:${g.load/g.teams*100}%"></i></div><br>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Audit log</h3>${S.audit.slice(0,25).map(a=>`<p style="font-size:13px;border-bottom:1px solid var(--line);padding:5px 0">${a.m}<br><small>${a.who} · ${ago(a.t)}</small></p>`).join('')}</div>`}
/* DETAIL DRAWER */
function cmp(r){return`<div><div class="cmp"><img src="${img(r)}" alt="Before cleanup"><div class="tp"><img src="${aft(r)}" alt="After cleanup"></div><i class="ln"></i><input type="range" min="0" max="100" value="50" data-sl aria-label="Compare before and after"><span style="left:8px">After</span><span style="right:8px">Before</span></div><p style="margin-top:6px">${r.status=='resolved'?'<span class="bd ok">Verified cleanup · reviewed</span>':'<span class="bd am">Pending review</span>'}</p></div>`}
function det(r){const sup=['supervisor','admin'].includes(S.role),ev=r.status;let h=`<aside class="dr" aria-label="Report details"><div class="drh"><b>${r.id}</b>${bd(ev)}<button class="x" data-act="close" aria-label="Close">${ic('x')}</button></div><img class="ph" src="${img(r)}" alt="Waste report photo"><p><b>${r.cat}</b> · <span style="color:${SC[r.sev]}">${r.sev}</span><br><small>${r.addr} · submitted ${ago(r.t)}${r.ngo?' · '+r.ngo:''}</small></p>`;
if(ev=='rejected')h+=`<div class="note rd">Rejected: ${r.rej||'insufficient evidence'}.${S.role=='citizen'?` <button class="btn s" data-act="appeal" data-id="${r.id}">Appeal with more details</button>`:''}</div>`;
if(['await','resolved'].includes(ev))h+=`<h3>See the difference</h3>`+cmp(r);
h+=`<details><summary>Why this result?</summary><ul><li>Duplicate check (rule-based): ${r.id=='WW-1044'?'possible match with another construction-debris report nearby':'no close match found'}.</li><li>AI-generated image estimate: ${r.ai&&r.ai.aiStatus=='complete'?`${r.ai.aiLabel} (${Math.round(r.ai.aiGeneratedScore*100)}% AI likelihood)`:'not available; human review required'}.</li><li>Metadata: unavailable. Missing metadata is not treated as a warning.</li><li>Location: not independently verified.</li><li>A supervisor reviews and can override.</li></ul></details>`;
if(sup&&['submitted','review'].includes(ev))h+=`<div class="note am">Human review needed before dispatch.</div><button class="btn p l" data-act="verify" data-id="${r.id}">Approve for dispatch</button><div style="display:flex;gap:8px"><select id="rj" aria-label="Rejection reason"><option>Not a waste issue</option><option>Confirmed duplicate</option><option>Insufficient evidence</option></select><button class="btn d s" data-act="reject" data-id="${r.id}">Reject</button></div><button class="btn s" data-act="info" data-id="${r.id}">Request more evidence</button>`;
if(sup&&ev=='verified'&&serverMode){h+=`<h3>Assign cleanup collector</h3><small>Enter the email of an existing collector account.</small><label for="collector-email">Collector account email</label><input id="collector-email" type="email" placeholder="collector@example.org"><button class="btn p l" data-act="assign" data-id="${r.id}">Assign task</button>`}else if(sup&&ev=='verified'){const {el,out}=rank(r);h+=`<h3>Ranked cleanup partners</h3><small>Eligibility filters apply first; weights are configurable starting points (distance 30, availability 25, suitability 20, capacity 15, reliability 10).</small>`+(el.map((c,i)=>`<div class="cand ${i?'':'best'}"><span class="sc">${c.sc}</span><b>${c.n.name}</b> ${i?'':'<span class="bd ok">Recommended</span>'}<br><small>${c.d.toFixed(1)} km · est. ${Math.round(c.d*3+8)}–${Math.round(c.d*3+15)} min (no routing data) · ${c.free} team(s) free</small><details><summary>Why?</summary><ul><li>${c.d.toFixed(1)} km away, inside its ${c.n.radius} km radius</li><li>Handles ${r.cat}</li><li>${c.free} free team(s)</li><li>Reliability ${Math.round(c.n.rel*100)}% (sample)</li></ul></details><button class="btn s ${i?'':'p'}" data-act="assign" data-id="${r.id}" data-n="${c.n.name}">Send invitation</button></div>`).join('')||'<div class="note rd">No eligible NGO. Escalate or request manual review.</div>')+(out.length?`<details><summary>${out.length} excluded</summary><ul>${out.map(o=>`<li>${o.n.name}: ${o.w}</li>`).join('')}</ul></details>`:'')}
if(sup&&ev=='await')h+=`<button class="btn p l" data-act="approve" data-id="${r.id}">Approve resolution</button><button class="btn s" data-act="back" data-id="${r.id}">Send back for rework</button>`;
return h+`<h3>Timeline</h3><div class="tl">${r.log.slice().reverse().map(l=>`<p>${l.m} <small>· ${ago(l.t)}</small></p>`).join('')}</div></aside>`}
/* ACTIONS */
function enter(r){S.role=r;V.view='app';V.tab=NAV[r][0][0];V.sel=null;V.guide=0;W=null;save();render()}
function act(a,d){const r=S.reports.find(x=>x.id==d.id),go=()=>{save();render()};switch(a){
case'auth':V.view='auth';V.mode=d.m;if(d.r)V.role=d.r;render();break;case'home':V.view='land';render();break;case'mode':V.mode=d.m;V.err='';render();break;case'role':V.role=d.r;render();break;
case'eye':{const i=$('#pw');i.type=i.type=='password'?'text':'password';break}case'forgot':toast('Demo mode: password reset emails are not sent.');break;
case'login':{const f=V.f;if(!/^\S+@\S+\.\S+$/.test(f.email))V.err='Enter a valid email address.';else if(f.pw.length<8)V.err='Password must be at least 8 characters.';else if(V.mode=='up'&&!f.name.trim())V.err='Enter your name.';else{V.err='';(async()=>{try{const result=V.mode=='up'?await api('/api/users/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.name,email:f.email,password:f.pw})}):await api('/api/users/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.email,password:f.pw})});apiToken=result.access_token;apiUser=result.user;sessionStorage.setItem('ww-token',apiToken);serverMode=true;S.role=apiUser.role;V.view='app';V.tab=NAV[apiUser.role][0][0];V.f.pw='';await refreshReports()}catch(error){V.err=error.message;render()}})()}render();break}
case'enter':serverMode=false;apiToken='';apiUser=null;sessionStorage.removeItem('ww-token');enter(d.r);toast('Signed in as demo '+RN[d.r]);break;case'logout':S.role=null;V.view='land';serverMode=false;apiToken='';apiUser=null;sessionStorage.removeItem('ww-token');save();render();break;
case'tab':V.tab=d.v;V.sel=null;if(d.v=='rep')W=newW();render();break;case'sel':if(V.view=='app'){V.sel=d.id;render()}break;case'close':V.sel=null;render();break;
case'theme':V.theme=V.theme=='dark'?'forest':'dark';render();break;case'guide':V.guide=!V.guide;render();break;case'cf':V.cf=d.v;render();break;case'flt':V.filter=d.v;render();break;case'ask':V.ans=ask(d.v);render();break;
case'reset':S=fresh();V.sel=null;V.guide=0;W=null;V.tab=NAV[S.role][0][0]||'';go();toast('Demo data reset');break;case'nav':if(r&&Number.isFinite(r.lat)&&Number.isFinite(r.lng)){window.open(`https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}`,'_blank','noopener,noreferrer')}else if(r&&r.addr){window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.addr)}`,'_blank','noopener,noreferrer')}else toast('This task has no location to search.');break;
case'rmimg':W.img=null;render();break;case'geo':{if(!navigator.geolocation)return toast('Location is not available in this browser.');toast('Getting your location…');navigator.geolocation.getCurrentPosition(pos=>placeLocation(pos.coords.latitude,pos.coords.longitude),err=>toast(err.code===1?'Allow location access in your browser, then try again.':'Could not get your location. Check GPS and try again.'),{enableHighAccuracy:true,timeout:12000,maximumAge:30000});break}
case'wb':W.step--;render();break;case'wn':{if(W.step==0&&!W.img)return toast('Add a photo to continue.');if(W.step==1&&W.lat==null)return toast('Drop a pin on the map to continue.');if(W.step==2&&W.desc.trim().length<5)return toast('Add a short description (5+ characters).');
if(W.step==3){if(serverMode){if(!apiToken)return toast('Sign in to your backend account before submitting.');submitToBackend();break}const id='WW-'+(1050+S.reports.length);Object.assign(W,{id,status:W.ai.rec=='amber'?'review':'submitted'});S.reports.unshift({id,cat:W.cat,sev:W.sev,x:W.x,y:W.y,status:W.status,mine:1,t:Date.now(),ngo:'',addr:'Pinned location',sd:S.reports.length+9,img:W.img,ai:W.ai,after:null,rej:'',log:[{t:Date.now(),m:'Report submitted: '+W.desc}]});audit(id+' submitted');note(['supervisor','admin'],id+' ('+W.cat+') needs review.');W.step=4;go();toast('Report submitted');break}
W.step++;if(W.step==3)analyze();else render();break}
case'trk':V.tab='home';V.sel=W.id;W=null;render();break;
case'verify':if(serverMode){changeBackendStatus(r,'verified').catch(e=>toast(e.message));break}r.status='verified';log(r,'Approved for dispatch by '+RN[S.role]);note(['citizen'],r.id+' was verified and is being matched with a cleanup partner.');go();toast('Approved for dispatch');break;
case'reject':if(serverMode){changeBackendStatus(r,'rejected',$('#rj').value).catch(e=>toast(e.message));break}r.status='rejected';r.rej=$('#rj').value;log(r,'Rejected: '+r.rej);note(['citizen'],r.id+' was rejected: '+r.rej+'. You can appeal.');go();toast('Report rejected');break;
case'info':r.status='review';log(r,'More evidence requested');note(['citizen'],'More evidence requested for '+r.id+'.');go();toast('Request sent');break;
case'appeal':r.status='review';r.rej='';log(r,'Citizen appealed; sent to human review');note(['supervisor','admin'],r.id+' appealed by citizen.');go();toast('Appeal submitted');break;
case'assign':{if(serverMode){const email=$('#collector-email')?.value.trim();if(!email)return toast('Enter a collector account email.');assignBackend(r,email).catch(e=>toast(e.message));break}const n=S.ngos.find(g=>g.name==d.n);if(r.status!='verified'||n.teams-n.load<1)return toast('That partner is no longer available.');n.load++;r.ngo=n.name;r.status='assigned';log(r,'Invitation sent to '+n.name+' (not confirmed until accepted)');note(['collector'],'New task: '+r.id+' ('+r.cat+') awaits acceptance.');V.sel=null;go();toast('Invitation sent to '+n.name);break}
case'step':{const nx=NX[r.status];if(serverMode){changeBackendStatus(r,nx[1]).catch(e=>toast(e.message));break}r.status=nx[1];log(r,nx[1]=='accepted'?'Accepted by NGO team':'Status: '+ST[nx[1]][0]);if(nx[1]=='accepted')note(['citizen'],r.id+' was accepted by '+r.ngo+'.');go();toast(ST[nx[1]][0]);break}
case'proof':if(serverMode){changeBackendStatus(r,'await').catch(e=>toast(e.message));break}r.after=V.pf[r.id]||true;delete V.pf[r.id];r.status='await';log(r,'Cleanup proof submitted');note(['supervisor','admin'],r.id+' proof awaits review.');go();toast('Proof submitted for review');break;
case'approve':{if(serverMode){changeBackendStatus(r,'resolved').catch(e=>toast(e.message));break}r.status='resolved';const n=S.ngos.find(g=>g.name==r.ngo);if(n&&n.load)n.load--;log(r,'Resolution approved by '+RN[S.role]);note(['citizen'],r.id+' was resolved and the cleanup was reviewed. See the difference.');go();toast('Resolved and verified');break}
case'back':r.status='cleaning';log(r,'Sent back for rework');go();toast('Sent back to collector');break}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a)act(a.dataset.act,a.dataset)});
document.addEventListener('keydown',e=>{if(e.key=='Enter'){const a=e.target.closest('g[data-act]');if(a)act(a.dataset.act,a.dataset)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f)V.f[t.dataset.f]=t.value;if(t.dataset.w&&W)W[t.dataset.w]=t.type=='checkbox'?t.checked:t.value;if('sl'in t.dataset)t.parentNode.style.setProperty('--p',t.value+'%')});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.w&&W)W[t.dataset.w]=t.type=='checkbox'?t.checked:t.value;if(t.dataset.file&&t.files[0])loadImg(t.files[0],(u,w,h)=>{if(t.dataset.file=='photo'){W.img=u;W.w=w;W.h=h;render()}else{V.pf[t.dataset.id]=u;toast('Photo ready')}})});
function loadImg(f,cb){if(!/^image\/(jpeg|png|webp)$/.test(f.type))return toast('Use a JPG, PNG or WebP image.');if(f.size>8e6)return toast('Image must be under 8 MB.');const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const k=Math.min(1,640/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72),i.width,i.height);URL.revokeObjectURL(u)};i.onerror=()=>toast('That file could not be read as an image.');i.src=u}
function render(){document.documentElement.dataset.theme=V.theme;$('#app').innerHTML=V.view=='land'?land():V.view=='auth'?auth():shell();initLiveMaps()}
if(S.role){V.view='app';V.tab=NAV[S.role][0][0]}render();
if(apiToken){api('/api/users/me').then(user=>{apiUser=user;serverMode=true;S.role=user.role;V.view='app';V.tab=NAV[user.role][0][0];return refreshReports()}).catch(()=>{apiToken='';sessionStorage.removeItem('ww-token')})}
</script></body></html>
